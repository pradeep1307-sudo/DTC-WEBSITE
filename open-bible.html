<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Opening Denver Tamil Church Bible…</title>
  <style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;display:grid;min-height:100vh;place-items:center;background:linear-gradient(145deg,#090909,#242424);color:#fff;font:700 16px Lato,Helvetica,Arial,sans-serif;text-align:center}main{width:min(calc(100% - 32px),440px);padding:32px;border:1px solid #3d3d3d;border-top:4px solid #cf1034;border-radius:16px;background:#171717;box-shadow:0 20px 52px rgba(0,0,0,.32)}p{margin:0 0 16px;line-height:1.55}p:last-child{margin:0}a{display:inline-flex;min-height:44px;padding:10px 16px;align-items:center;border:2px solid #cf1034;border-radius:10px;background:#cf1034;color:#fff;text-decoration:none}a:hover{border-color:#e1193e;background:#e1193e}a:focus-visible{outline:3px solid #fff;outline-offset:3px}</style>
</head>
<body>
  <main><p>Opening this verse in the Denver Tamil Church app…</p><p><a id="store-link" href="#">Download the app</a></p></main>
  <script>
    (() => {
      const reference = new URLSearchParams(location.search).get('reference') || 'John 3:16';
      const deepLink = `denvertamilchurch://bible?reference=${encodeURIComponent(reference)}`;
      const androidStore = 'https://play.google.com/store/apps/details?id=org.denvertamilchurch.app';
      const appleStore = `https://apps.apple.com/us/search?term=${encodeURIComponent('Denver Tamil Church')}`;
      const store = /iPad|iPhone|iPod/.test(navigator.userAgent) ? appleStore : androidStore;
      document.getElementById('store-link').href = store;
      let fallback = setTimeout(() => location.replace(store), 1600);
      document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(fallback); fallback = null; } });
      location.replace(deepLink);
    })();
  </script>
</body>
</html>
